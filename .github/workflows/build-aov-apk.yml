
name: Build AoV Asset Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - zip-extracted-1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found: $SDKMANAGER"
            find "$ANDROID_HOME" -name sdkmanager -type f
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Verify project files
        working-directory: AoVAssetEditorAndroid
        run: |
          set -euo pipefail
          ls -la

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app module not found"
            exit 1
          fi

      - name: Build debug APK
        working-directory: AoVAssetEditorAndroid
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AoVAssetEditor-debug-apk
          path: AoVAssetEditorAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
