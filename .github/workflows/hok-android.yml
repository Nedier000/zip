name: Build HoK Tool Android (full port)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'scripts/**'
      - 'THIRD_PARTY_LICENSES.md'
      - 'STUDIO_HOK_LICENSE.txt'
      - 'android_port_payload.b64.*'
      - '.github/workflows/hok-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Android port
        uses: actions/checkout@v4

      - name: Restore Android port source payload
        shell: bash
        run: |
          set -euxo pipefail
          cat android_port_payload.b64.* | base64 -d > "$RUNNER_TEMP/hok_android_port_payload.tar.gz"
          tar -xzf "$RUNNER_TEMP/hok_android_port_payload.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Audit restored Android source for remaining features\n        run: python3 mobile/diagnose_android_source.py\n\n      - name: Resolve Android namespace and API ambiguities
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def prepend_aliases(path, aliases):
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"Missing source file: {path}")
              s = p.read_text(encoding="utf-8")
              for alias in reversed(aliases):
                  if alias not in s:
                      s = alias + chr(10) + s
              p.write_text(s, encoding="utf-8")

          prepend_aliases("mobile/AssetBrowser.cs", [
              "using Mesh = AssetStudio.Mesh;",
              "using Shader = AssetStudio.Shader;",
              "using GameManager = AssetStudio.GameManager;",
              "using Path = System.IO.Path;",
          ])
          prepend_aliases("mobile/SafTree.cs", [
              "using Uri = global::Android.Net.Uri;",
          ])

          p = Path("mobile/MainActivity.cs")
          s = p.read_text(encoding="utf-8")
          aliases = [
              "using Uri = global::Android.Net.Uri;",
              "using Path = System.IO.Path;",
              "using OperationCanceledException = System.OperationCanceledException;",
          ]
          for alias in reversed(aliases):
              if alias not in s:
                  s = alias + chr(10) + s
          s = s.replace("Android.Content.", "global::Android.Content.")
          s = s.replace("Resource.Attribute.", "global::Android.Resource.Attribute.")
          s = s.replace("Resource.Layout.", "global::Android.Resource.Layout.")
          s = s.replace("Android.global::Android.Resource.", "global::Android.Resource.")

          # Button click helpers use Func<Task>; folder pick handlers are
          # synchronous, so explicitly return a completed Task.
          for code in ("PickDbInput", "PickDbOutput", "PickAssetInput", "PickAssetOutput"):
              s = s.replace(f"() => PickFolder({code})",
                            f"() => {{ PickFolder({code}); return Task.CompletedTask; }}")

          # Android .NET bindings expose setters as methods rather than
          # writable properties for these Java view attributes.
          s = s.replace(", SingleLine = true", "")
          if "searchBox.SetSingleLine(true);" not in s:
              s = s.replace("searchBox = new EditText(this) { Hint = \"Tìm tên, PathID hoặc loại asset…\", TextSize = 13 };",
                            "searchBox = new EditText(this) { Hint = \"Tìm tên, PathID hoặc loại asset…\", TextSize = 13 };" + chr(10) + "        searchBox.SetSingleLine(true);")
          s = s.replace(", AllCaps = false", "")
          s = s.replace("var clearVisible = new Button(this) { Text = \"BỎ CHỌN\", TextSize = 10 };",
                        "var clearVisible = new Button(this) { Text = \"BỎ CHỌN\", TextSize = 10 };" + chr(10) + "        selectVisible.SetAllCaps(false);" + chr(10) + "        clearVisible.SetAllCaps(false);")
          s = s.replace("var image = new ImageView(this) { AdjustViewBounds = true };",
                        "var image = new ImageView(this);" + chr(10) + "                image.SetAdjustViewBounds(true);")
          p.write_text(s, encoding="utf-8")

          p = Path("mobile/Program.cs")
          s = p.read_text(encoding="utf-8").replace("Android.Util.", "global::Android.Util.")
          p.write_text(s, encoding="utf-8")

          p = Path("mobile/DbIndexExtractor.cs")
          db = p.read_text(encoding="utf-8")
          old = "byte[] result = dec.Unwrap(src);"
          new = "byte[] result = dec.Unwrap(src).ToArray();"
          if old in db:
              db = db.replace(old, new, 1)
          elif new not in db:
              raise SystemExit("Could not locate Zstd Unwrap result assignment")
          p.write_text(db, encoding="utf-8")
          print("Fixed Zstd Unwrap Span<byte> to byte[] conversion")
          PY

      - name: Apply safe standalone TextAsset editor
        shell: bash
        run: |
          set -euxo pipefail
          test -s mobile/SerializedTextAssetPatcher.cs
          python3 mobile/patch_textasset_editor.py
          python3 mobile/patch_db_large_asset.py
          grep -n -E 'SỬA TEXTASSET|EditSelectedTextAsset|SaveTextAssetEditAsync' mobile/MainActivity.cs

      - name: Set Android API target in app project
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mobile/HOKTool.Android.csproj")
          if not p.is_file():
              raise SystemExit(f"Android project missing: {p}")
          s = p.read_text(encoding="utf-8")
          old = "<TargetFramework>net8.0-android</TargetFramework>"
          new = "<TargetFramework>net8.0-android34.0</TargetFramework>"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Expected Android TargetFramework element was not found")
          p.write_text(s, encoding="utf-8")
          print("Configured app TargetFramework=net8.0-android34.0")
          PY
          grep -n -E 'TargetFramework|TargetPlatformVersion|SupportedOSPlatformVersion' mobile/HOKTool.Android.csproj

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET SDK 8 for Android workload
        shell: bash
        run: |
          set -euxo pipefail
          printf '{\n  "sdk": { "version": "8.0.428", "rollForward": "disable" }\n}\n' > global.json
          dotnet --version
          dotnet --info


      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Fetch pinned HoK parser and native decoder sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p thirdparty
          git clone --filter=blob:none https://github.com/yarik0chka/Studio-HoK.git thirdparty/Studio-HoK
          git -C thirdparty/Studio-HoK checkout 9deed74d3f61c0b28ad6747184281b6adc1b0710
          git clone --filter=blob:none https://github.com/powzix/ooz.git thirdparty/ooz
          git -C thirdparty/ooz checkout 05038060aa68f9187ae9923b2388ca8db40e58d1
          git clone --filter=blob:none https://github.com/DLTcollab/sse2neon.git thirdparty/sse2neon
          git -C thirdparty/sse2neon checkout 2272251cc3ad9cba8b8c47c4065811cfb396b802
          python3 scripts/patch_studio.py thirdparty/Studio-HoK
          python3 scripts/prepare_ooz.py thirdparty/ooz native/ooz
          cp thirdparty/sse2neon/sse2neon.h native/ooz/sse2neon.h

      - name: Build Oodle-compatible decompressor for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          mkdir -p mobile/Platforms/Android/jniLibs/arm64-v8a
          "$CXX" --target=aarch64-linux-android23 -std=c++14 -O2 -fPIC -shared \
            -fno-strict-aliasing -fvisibility=hidden \
            -Wno-deprecated-declarations -Wno-unused-parameter \
            -D_byteswap_uint64=__builtin_bswap64 \
            -Inative/ooz \
            native/ooz/kraken.cpp native/ooz/bitknit.cpp native/ooz/lzna.cpp native/ooz/wrapper.cpp \
            -o mobile/Platforms/Android/jniLibs/arm64-v8a/libooz.so
          file mobile/Platforms/Android/jniLibs/arm64-v8a/libooz.so

      - name: Create temporary APK signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/hoktool.keystore" -storepass android -keypass android \
            -alias hoktool -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HoK Tool Android, OU=Build, O=Local Tools, L=NA, S=NA, C=VN"

      - name: Restore and build release APK
        shell: bash
        run: |
          set -euxo pipefail
          dotnet restore mobile/HOKTool.Android.csproj -p:TargetFramework=net8.0-android34.0 -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false
          dotnet publish mobile/HOKTool.Android.csproj \
            -c Release -f net8.0-android34.0 -r android-arm64 --self-contained true \
            -p:AndroidPackageFormat=apk \
            -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/hoktool.keystore" \
            -p:AndroidSigningKeyAlias=hoktool \
            -p:AndroidSigningKeyPass=android \
            -p:AndroidSigningStorePass=android
          mkdir -p dist
          mapfile -t CANDIDATES < <(find mobile/bin/Release -type f -name '*.apk' -print | sort)
          printf 'APK candidates found: %s\n' "${#CANDIDATES[@]}"
          printf '%s\n' "${CANDIDATES[@]}"
          test "${#CANDIDATES[@]}" -gt 0
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          declare -A VERIFIED_BY_HASH=()
          for apk in "${CANDIDATES[@]}"; do
            if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
              digest="$(sha256sum "$apk" | awk '{print $1}')"
              VERIFIED_BY_HASH["$digest"]="$apk"
            fi
          done
          mapfile -t VERIFIED_APKS < <(for apk in "${VERIFIED_BY_HASH[@]}"; do printf '%s\n' "$apk"; done | sort)
          if [ "${#VERIFIED_APKS[@]}" -ne 1 ]; then
            echo "Expected one unique signed ARM64 APK; found ${#VERIFIED_APKS[@]}."
            echo "Unsigned and signed APK candidate list:"
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi
          cp "${VERIFIED_APKS[0]}" dist/HoK-Tool-Android-arm64.apk
          test -s dist/HoK-Tool-Android-arm64.apk
          "$APKSIGNER" verify --verbose dist/HoK-Tool-Android-arm64.apk
          sha256sum dist/HoK-Tool-Android-arm64.apk | tee dist/SHA256SUMS.txt

      - name: Package corresponding source and licenses
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/source
          cp -a mobile scripts THIRD_PARTY_LICENSES.md STUDIO_HOK_LICENSE.txt dist/source/
          cp -a thirdparty/Studio-HoK dist/source/Studio-HoK
          cp -a thirdparty/ooz dist/source/ooz
          cp -a thirdparty/sse2neon dist/source/sse2neon
          cp -a native/ooz dist/source/native-ooz-android
          find dist/source -name .git -type d -prune -exec rm -rf {} +
          cp /usr/share/common-licenses/GPL-3 dist/source/GPL-3.0.txt
          tar -czf dist/HoK-Tool-Android-corresponding-source.tar.gz -C dist/source .

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: HoK-Tool-Android-ARM64-APK
          path: |
            dist/HoK-Tool-Android-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: HoK-Tool-Android-ARM64-source
          path: dist/HoK-Tool-Android-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 30
