
name: Extract ZIP to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t zips < <(
            find . -maxdepth 1 -type f -iname '*.zip'
          )

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Can ho tro dung 1 file ZIP o thu muc goc."
            exit 1
          fi

          ZIP="${zips[0]}"
          echo "Extracting: $ZIP"

          sudo apt-get update
          sudo apt-get install -y unzip

          unzip -o "$ZIP" -d extracted_tmp

          # Copy files, including hidden files and folders.
          cp -a extracted_tmp/. .

          rm -rf extracted_tmp
          rm -f "$ZIP"

      - name: Commit extracted files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "zip-extracted-${GITHUB_RUN_NUMBER}"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi

          git commit -m "Extract project ZIP"
          git push origin HEAD
          
